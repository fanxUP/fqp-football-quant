{
  "schema_version": 4,
  "execution": {
    "command_timeout_seconds": 1800
  },
  "commands": {
    "test": "FQP_PLAYER_IDENTITY_TEST_DSN=${FQP_PLAYER_IDENTITY_TEST_DSN:?must point to explicit isolated PG16} .venv/bin/python -m pytest -q tests/test_scripts/test_player_identity_bridge.py tests/test_scripts/test_player_identity_candidates.py tests/test_computation/test_player_identity_bridge_postgres.py",
    "lint": ".venv/bin/ruff check scripts/player_identity_bridge.py scripts/player_identity_candidates.py tests/test_scripts/test_player_identity_bridge.py tests/test_scripts/test_player_identity_candidates.py tests/test_computation/test_player_identity_bridge_postgres.py && .venv/bin/ruff format --check scripts/player_identity_bridge.py scripts/player_identity_candidates.py tests/test_scripts/test_player_identity_bridge.py tests/test_scripts/test_player_identity_candidates.py tests/test_computation/test_player_identity_bridge_postgres.py && git diff --check",
    "typecheck": ".venv/bin/mypy scripts/player_identity_bridge.py scripts/player_identity_candidates.py --explicit-package-bases"
  },
  "paths": {
    "dependency_files": [
      "requirements.txt",
      "requirements-dev.txt",
      "pyproject.toml",
      "apps/backend/requirements.txt",
      "apps/backend/pyproject.toml",
      "apps/frontend/package.json",
      "apps/frontend/package-lock.json"
    ],
    "migrations": [
      "**/migrations/**",
      "**/*.sql"
    ],
    "ignore_untracked": [
      "uv.lock"
    ]
  },
  "quality_gate": {
    "engine_path": "/Users/estefan-macworkstation/.remote-vibe-coding/engine/vibe.py",
    "repository": "fanxUP/fqp-football-quant",
    "required_branch": "main",
    "required_workflow": "CI",
    "required_checks": [
      "test",
      "lint-and-typecheck"
    ],
    "preflight": "python3 -I -S -B .vibe/quality_gate.py --repo ."
  }
}
