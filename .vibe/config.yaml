{
  "schema_version": 4,
  "execution": {
    "command_timeout_seconds": 1800
  },
  "commands": {
    "test": ".venv/bin/python -m pytest -q tests/test_api/test_odds_movements.py && npm --prefix apps/frontend test -- src/pages/OddsMovementPage.test.tsx",
    "lint": ".venv/bin/ruff check apps/backend/src/routers/dashboard.py apps/backend/src/services/odds_movement.py apps/backend/src/services/odds_market_reference.py tests/test_api/test_odds_movements.py && .venv/bin/ruff format --check apps/backend/src/routers/dashboard.py apps/backend/src/services/odds_movement.py apps/backend/src/services/odds_market_reference.py tests/test_api/test_odds_movements.py && git diff --check",
    "typecheck": ".venv/bin/mypy apps/backend/src/services/odds_market_reference.py --explicit-package-bases && npm --prefix apps/frontend run typecheck && npm --prefix apps/frontend run build"
  },
  "paths": {
    "dependency_files": [
      "requirements.txt",
      "requirements-dev.txt",
      "pyproject.toml",
      "apps/backend/requirements.txt",
      "apps/backend/pyproject.toml",
      "apps/frontend/package.json",
      "apps/frontend/package-lock.json"
    ],
    "migrations": [
      "**/migrations/**",
      "**/*.sql"
    ],
    "ignore_untracked": [
      "uv.lock"
    ]
  },
  "quality_gate": {
    "engine_path": "/Users/estefan-macworkstation/.remote-vibe-coding/engine/vibe.py",
    "repository": "fanxUP/fqp-football-quant",
    "required_branch": "main",
    "required_workflow": "CI",
    "required_checks": [
      "test",
      "lint-and-typecheck"
    ],
    "preflight": "python3 -I -S -B .vibe/quality_gate.py --repo ."
  }
}
