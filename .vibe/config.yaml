{
  "schema_version": 4,
  "execution": {
    "command_timeout_seconds": 900
  },
  "commands": {
    "test": ".venv/bin/python -m pytest -q tests/test_jobs/test_traditional_history_import.py tests/test_local/test_release_migration_policy.py tests/test_local/test_vibe_quality_gate.py tests/test_scripts/test_official_storage.py",
    "lint": ".venv/bin/ruff check .vibe/quality_gate.py ops/server/release_migration_policy.py scripts/football_pool_catalog.py scripts/official_crawler.py scripts/official_storage.py scripts/traditional_history_import.py scripts/traditional_history_type_repair.py tests/test_local/test_vibe_quality_gate.py",
    "typecheck": "npm --prefix apps/frontend run typecheck"
  },
  "paths": {
    "dependency_files": [
      "requirements.txt",
      "requirements-dev.txt",
      "pyproject.toml",
      "apps/backend/requirements.txt",
      "apps/backend/pyproject.toml",
      "apps/frontend/package.json",
      "apps/frontend/package-lock.json"
    ],
    "migrations": [
      "**/migrations/**",
      "**/*.sql"
    ],
    "ignore_untracked": []
  },
  "quality_gate": {
    "engine_path": "/Users/estefan-macworkstation/.remote-vibe-coding/engine/vibe.py",
    "repository": "fanxUP/fqp-football-quant",
    "required_branch": "main",
    "required_workflow": "CI",
    "required_checks": [
      "test",
      "lint-and-typecheck"
    ],
    "preflight": "python3 -I -S -B .vibe/quality_gate.py --repo ."
  }
}
