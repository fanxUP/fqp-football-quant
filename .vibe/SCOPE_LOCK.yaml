  "notes": "Single main branch. Preserve strict P104 source-observation and P106/P111/P114 point-in-time rules. This scope includes verified competition-season identity, P111/P114 descriptive paired replay, the CI-required Python 3.14 Ruff format correction across 73 Python files, and one stale source-evaluation test assertion aligned with explicit predeclared-window semantics. The formatter removes redundant parentheses around multiple exception types without behavior changes; the test change asserts that a rolling latest-week window is not a predeclared holdout. Season identity is read only through the immutable Sporttery JC link and verified season catalog. Evaluation must be one verified season; mixed or missing scope is not_evaluable. The paired helper accepts a separate read-only incumbent replay report so the P111 evaluator stays on its isolated research database; matching requires identical verified season, prediction time, result identity, and odds snapshot identity. Every paired result remains descriptive-only and non-promotable. The Brier bound uses an Azuma-Hoeffding date-cluster martingale interval only when an explicit inclusive absolute final-window start/end pair is configured and its length matches holdout_days. A rolling latest-N-day window is diagnostic only; exploratory folds and repeated progress looks cannot trigger decisions. The bounded research loader retains dated fixtures with unresolved results so predeclared final windows cannot silently omit them. No new dependency, background task, or external HTTP API. One logical schema migration is in scope: sql/139_prediction_recovery_index.sql creates the P105 partial expression index concurrently and sql/down/139_prediction_recovery_index.down.sql removes it concurrently; no business rows are rewritten and migration 139 may be released only through an exact-SHA-pinned no-backup policy with a fresh isolated PostgreSQL rehearsal, valid/ready index proof, indexed runtime-role query plan, and verified down/reapply behavior; no other production migration is authorized by this scope. This extension repairs the observed P105 run_due recovery timeout with split indexed ownership queries; no P105 candidate probability enters the formal prediction path. This follow-up updates the active acceptance/plan and records policy test evidence. The static P108 coverage report uses only CSV exports; no active NAS SQLite or production data is queried. The no-backup 139 release policy is local, reviewed, and CI-pending; production migration remains unapplied. Authorized 2026-11-13 maintenance: repair match-center current/history boundaries, separate missing-result evidence from recorded match status, and move filtering/sorting/pagination/counts to one backend query. Current includes future and previous 48 hours of non-final fixtures. No migration, production write, importer, prediction/odds change, dependency, push or deployment in this maintenance. Preserve earlier workflow status; record the scoped local evidence separately."
