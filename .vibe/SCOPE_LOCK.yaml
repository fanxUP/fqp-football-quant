  "notes": "Single main branch. Preserve strict P104 source-observation and P106/P111/P114 point-in-time rules. This scope includes verified competition-season identity, P111/P114 descriptive paired replay, and the CI-required Python 3.14 Ruff format correction across 73 Python files; the latter removes redundant parentheses around multiple exception types and is behavior-neutral. Season identity is read only through the immutable Sporttery JC link and verified season catalog. Evaluation must be one verified season; mixed or missing scope is not_evaluable. The paired helper accepts a separate read-only incumbent replay report so the P111 evaluator stays on its isolated research database; matching requires identical verified season, prediction time, result identity, and odds snapshot identity. Every paired result remains descriptive-only and non-promotable. The Brier bound uses an Azuma-Hoeffding date-cluster martingale interval only when an explicit inclusive absolute final-window start/end pair is configured and its length matches holdout_days. A rolling latest-N-day window is diagnostic only; exploratory folds and repeated progress looks cannot trigger decisions. The bounded research loader retains dated fixtures with unresolved results so predeclared final windows cannot silently omit them. No new dependency, background task, or external HTTP API. One logical schema migration is in scope: sql/139_prediction_recovery_index.sql creates the P105 partial expression index concurrently and sql/down/139_prediction_recovery_index.down.sql removes it concurrently; no business rows are rewritten and no production migration is applied here. This extension repairs the observed P105 run_due recovery timeout with split indexed ownership queries; no P105 candidate probability enters the formal prediction path."
