# Internal selection policy, not access authorization, coverage verification,
# independence or accuracy. Lower rank wins for this field only; equal ranks
# must agree. Reposts do not vote. No new source is enabled by this section.
field_resolution:
  version: observation-fields/v1
  fields:
    weather.temperature_2m:
      domain: weather
      subject: forecast
      extractor: temperature_2m/v1
      max_age_seconds: 21600
      sources: {open_meteo: 10}
    lineup.starters:
      domain: lineup
      subject: team
      extractor: lineup.starters/v1
      max_age_seconds: 1800
      sources: {api_football: 10}
    injuries.complete_report:
      domain: injuries
      subject: team
      extractor: injuries.complete_report/v1
      max_age_seconds: 1800
      sources: {api_football: 10}
