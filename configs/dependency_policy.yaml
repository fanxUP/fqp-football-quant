policy_name: local_latest_no_pinning
scope: local_personal_deployment
priority: final_execution_policy
principles:
  - 项目使用 Codex 进行开发、维护、测试、修复和代码审查。
  - 前端、后端、Worker、Scheduler、PostgreSQL 与 Redis 全部使用 macOS 本机服务。
  - Python、Node、PostgreSQL、Redis 等组件不在项目中锁死版本。
  - 主机已安装组件时，优先使用本地计算机当前版本。
  - 主机缺失组件时，按官方安装渠道安装当前最新版。
  - Python requirements 不使用 == 固定版本；必要时仅使用包名或最低兼容范围。
  - 每次启动时生成 runtime_version_snapshot.json，用于问题排查，不作为版本锁。
non_pinned_files:
  - requirements.txt
  - requirements-dev.txt
  - ops/local/manage_local_stack.sh
version_snapshot:
  enabled: true
  output: data/runtime_version_snapshot.json
installation_mode:
  local_host_processes: required
  codex_cli: latest_if_missing
  python_packages: latest_resolved_by_pip
  node_packages: latest_resolved_by_npm
risk_controls:
  - 每月备份 runtime_version_snapshot.json，记录当月实际运行版本。
  - 每次依赖更新后必须运行本机运行回归测试和健康检查。
  - 如果最新版依赖导致故障，使用 Python 虚拟环境重建、本机 PostgreSQL 备份恢复或 Codex 修复分支处理。
