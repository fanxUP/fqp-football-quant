# 历史模型目录设计及早期 SQL 种子参考；运行时不读取本文件。
# 实际启用状态以数据库 model_versions 和预测入口的模型支持范围为准。
# 此处六项不代表当前全部模型，也不控制线上启用或发布资格。
models:
  - name: market_baseline
    version: v1
    paper_key: none
    role: market_probability
    production_allowed: true
  - name: maher_poisson
    version: v1
    paper_key: maher1982
    role: score_distribution
    production_allowed: false
    require_backtest: true
  - name: dixon_coles
    version: v1
    paper_key: dixoncoles1997
    role: low_score_adjustment
    production_allowed: false
    require_backtest: true
  - name: shin_probability
    version: v1
    paper_key: shin1993
    role: odds_margin_removal
    production_allowed: false
  - name: favourite_longshot_bias
    version: v1
    paper_key: cainlawpeel2003
    role: bias_adjustment
    production_allowed: false
  - name: elo_rating
    version: v1
    paper_key: elo1978
    role: dynamic_strength_rating
    production_allowed: false
    require_backtest: true
