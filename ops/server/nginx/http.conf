# Loaded in http{} by conf.d on both Ubuntu and the Docker frontend.
# Restrict long caching to Vite's generated, content-versioned asset names.
map $uri $fqp_static_expires {
    default -1;
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|png|jpe?g|webp|avif|svg|ico)$" 1y;
}

# Do not log the raw request, arguments, referrer, Cookie or Authorization.
log_format fqp_timing escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"backend_request_id":"$upstream_http_x_request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"body_bytes_sent":$body_bytes_sent,"request_time":"$request_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"gzip_ratio":"$gzip_ratio"}';
