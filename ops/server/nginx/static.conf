# Include only in the FQP server{}; leave its proxy, TLS and security rules intact.
access_log /var/log/nginx/access.log fqp_timing;
proxy_cache off;

location ^~ /assets/ {
    # Missing chunks must be a real 404, never the SPA HTML fallback.
    try_files $uri =404;
    expires $fqp_static_expires;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
}

location = /login-football-bg.webp {
    try_files $uri =404;
    expires -1;
}

# Use expires rather than location-level add_header: Nginx <1.29.3 would otherwise
# drop inherited security headers. Error statuses do not receive a long max-age.
