services:
  backend:
    profiles: [docker-app]

  frontend:
    profiles: [docker-app]

  worker:
    environment:
      FQP_API_HEALTH_URL: http://host.docker.internal:8006/health
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../apps/backend/src:/app/apps/backend/src:ro
      - ../../scripts:/app/scripts:ro
      - ../../.runtime:/app/.runtime

  scheduler:
    environment:
      FQP_API_HEALTH_URL: http://host.docker.internal:8006/health
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../apps/backend/src:/app/apps/backend/src:ro
      - ../../scripts:/app/scripts:ro
      - ../../data/backups:/app/backups
      - ../../.runtime:/app/.runtime
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
