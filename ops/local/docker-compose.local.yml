name: fqp-local

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: fqp
      POSTGRES_USER: fqp
      POSTGRES_PASSWORD: fqp_local_password
    ports:
      - "127.0.0.1:${FQP_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ../../data/postgres:/var/lib/postgresql
      - ../../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fqp -d fqp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis
    ports:
      - "127.0.0.1:${FQP_REDIS_PORT:-6379}:6379"
    volumes:
      - ../../data/redis:/data
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.api
    ports:
      - "127.0.0.1:${FQP_BACKEND_PORT:-8000}:8000"
    env_file: .env.local
    volumes:
      - ../../apps/backend/src:/app/apps/backend/src
      - ../../scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      com.fqp.git.revision: "${FQP_DEPLOY_REVISION:-unknown}"
    restart: unless-stopped

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FQP_FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ../../apps/frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    labels:
      com.fqp.git.revision: "${FQP_DEPLOY_REVISION:-unknown}"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.api
    command: python -u -m scripts.official_crawler_stub
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      com.fqp.git.revision: "${FQP_DEPLOY_REVISION:-unknown}"
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.api
    command: python -u -m scripts.jobs.run_scheduler
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../data/backups:/app/backups
    labels:
      com.fqp.git.revision: "${FQP_DEPLOY_REVISION:-unknown}"
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:${FQP_GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana_data:
