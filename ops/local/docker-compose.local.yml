services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: fqp
      POSTGRES_USER: fqp
      POSTGRES_PASSWORD: fqp_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ../../data/postgres:/var/lib/postgresql
      - ../../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fqp -d fqp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../../data/redis:/data

  backend:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.api
    command: python -u -m scripts.official_crawler_stub
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.api
    command: python -u -m scripts.jobs.run_scheduler
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
