name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy apps/backend/src scripts --explicit-package-bases

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/model-bridge/package-lock.json

      - name: Pi model bridge quality gates
        working-directory: apps/model-bridge
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Frontend quality gates
        working-directory: apps/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fqp_test
          POSTGRES_USER: fqp
          POSTGRES_PASSWORD: fqp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The legacy schema/observation fixture uses fqp as its bootstrap admin.
      # Keep permission regressions on a separate disposable cluster where fqp
      # really is a restricted runtime role; never use that superuser as proof.
      audit-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fqp_audit_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fqp_audit_fixture_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/model-bridge/package-lock.json

      - name: Install server model bridge
        run: npm --prefix apps/model-bridge ci --ignore-scripts

      - name: Initialize test database schema
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_test \
            -c "CREATE ROLE fqp_observation_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_test \
            -c "GRANT USAGE,CREATE ON SCHEMA public TO fqp_observation_owner"
          ordered_migrations() {
            local migration filename version
            for migration in sql/*.sql; do
              filename="${migration##*/}"
              [[ "$filename" =~ ^([0-9]+)_.*\.sql$ ]] || continue
              version=$((10#${BASH_REMATCH[1]}))
              printf '%s\t%s\n' "$version" "$migration"
            done | sort -n -k1,1 | cut -f2-
          }
          while IFS= read -r f; do
            PGPASSWORD=fqp_test_password psql -X -v ON_ERROR_STOP=1 \
              -h localhost -U fqp -d fqp_test -f "$f"
          done < <(ordered_migrations)
        env:
          PGPASSWORD: fqp_test_password

      - name: Initialize isolated Pi credential database
        run: |
          createdb -h localhost -U fqp fqp_pi_test
          psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_pi_test \
            -f sql/58_llm_provider_connections.sql \
            -f sql/59_llm_agent_bindings.sql \
            -f sql/106_pi_model_credentials.sql
        env:
          PGPASSWORD: fqp_test_password

      - name: Initialize isolated feature contract database
        run: |
          set -euo pipefail
          createdb -h localhost -U fqp fqp_feature_contract_test
          pg_dump --schema-only --no-owner --no-privileges -h localhost -U fqp -d fqp_test \
            | psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_feature_contract_test
          psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_feature_contract_test \
            -c "COMMENT ON DATABASE fqp_feature_contract_test IS 'fqp-p102-isolated-fixtures/v1'"
        env:
          PGPASSWORD: fqp_test_password

      - name: Initialize isolated observation database
        run: bash scripts/ci/init_observation_test_db.sh
        env:
          FQP_ALLOW_ISOLATED_OBSERVATION_SETUP: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: fqp
          PGDATABASE: fqp_test
          PGPASSWORD: fqp_test_password

      - name: Verify prediction inputs without skipped database tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/p105-inputs.xml"
          python -m pytest -q --junitxml="$report" \
            tests/test_storage/test_prediction_input_policy.py \
            tests/test_computation/test_prediction_input_updates_postgres.py \
            tests/test_computation/test_prediction_input_revisions_postgres.py \
            tests/test_computation/test_prediction_input_fence_postgres.py \
            tests/test_computation/test_prediction_input_runtime_postgres.py \
            tests/test_local/test_native_database_runtime.py
          python scripts/ci/verify_prediction_input_results.py "$report"
        env:
          DATABASE_URL: postgresql://invalid:invalid@unavailable.invalid/disabled
          FQP_OBSERVATION_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=fqp_observation_test dbname=fqp_observation_test
          PGPASSWORD: fqp_test_password

      - name: Initialize isolated audit, P106 and history databases
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5433 -U postgres -d fqp_audit_test_ci <<'SQL'
          CREATE ROLE fqp NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE fqp_p106_test_ci;
          CREATE DATABASE fqp_history_test_ci;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='fqp'
                AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole
                AND NOT rolreplication AND NOT rolbypassrls AND NOT rolcanlogin)
                OR pg_has_role('fqp', 'postgres', 'MEMBER') THEN
              RAISE EXCEPTION 'Unsafe audit runtime role';
            END IF;
          END $$;
          SQL
        env:
          PGPASSWORD: fqp_audit_fixture_password

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          pytest tests apps/backend/src --cov=. --cov-report=xml --cov-report=term \
            --cov-fail-under=50 -m "not slow" --junitxml="${RUNNER_TEMP}/regressions.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          required = {
              "tests.test_computation.test_prediction_run_postgres",
              "tests.test_computation.test_prematch_dataset_postgres",
              "tests.test_computation.test_prediction_job_execution_postgres",
              "tests.test_computation.test_backtest_job_execution_postgres",
              "tests.test_computation.test_generic_job_audit_postgres",
              "tests.test_computation.test_real_ticket_postgres",
              "tests.test_computation.test_shadow_training_postgres",
              "tests.test_computation.test_contamination_audit_postgres",
              "tests.test_sql.test_dashboard_prediction_count",
              "tests.test_data_sources.titan007.test_history_backfill",
          }
          services = {str(p.with_suffix("")).replace("/", ".")
                      for p in Path("apps/backend/src").rglob("test_*.py")}
          if not services:
              raise SystemExit("Backend service/router tests were not found")
          required |= services
          cases = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "regressions.xml").findall(".//testcase")
          for module in sorted(required):
              selected = [c for c in cases if c.get("classname", "") == module
                          or c.get("classname", "").startswith(module + ".")]
              if not selected or any(c.find(s) is not None for c in selected
                                     for s in ("skipped", "error", "failure")):
                  raise SystemExit(f"Required regression missing or not passed: {module}")
              print(f"{module}: {len(selected)} passed, no skips")
          PY
        env:
          DATABASE_URL: postgresql://fqp:fqp_test_password@localhost:5432/fqp_test
          FQP_PI_TEST_DB: postgresql://fqp:fqp_test_password@localhost:5432/fqp_pi_test
          FQP_QUOTA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          FQP_FEATURE_TEST_POSTGRES_DSN: postgresql://fqp:fqp_test_password@localhost:5432/fqp_feature_contract_test
          FQP_OBSERVATION_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=fqp_observation_test dbname=fqp_observation_test
          FQP_P106_TEST_DATABASE_URL: postgresql://postgres:fqp_audit_fixture_password@127.0.0.1:5433/fqp_p106_test_ci
          FQP_AUDIT_TEST_DATABASE_URL: postgresql://postgres:fqp_audit_fixture_password@127.0.0.1:5433/fqp_audit_test_ci
          FQP_HISTORY_TEST_DSN: postgresql://postgres:fqp_audit_fixture_password@127.0.0.1:5433/fqp_history_test_ci
          PGPASSWORD: fqp_test_password
