name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy apps/backend/src scripts --explicit-package-bases

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/model-bridge/package-lock.json

      - name: Pi model bridge quality gates
        working-directory: apps/model-bridge
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Frontend quality gates
        working-directory: apps/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fqp_test
          POSTGRES_USER: fqp
          POSTGRES_PASSWORD: fqp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/model-bridge/package-lock.json

      - name: Install server model bridge
        run: npm --prefix apps/model-bridge ci --ignore-scripts

      - name: Initialize test database schema
        run: |
          set -euo pipefail
          ordered_migrations() {
            local migration filename version
            for migration in sql/*.sql; do
              filename="${migration##*/}"
              [[ "$filename" =~ ^([0-9]+)_.*\.sql$ ]] || continue
              version=$((10#${BASH_REMATCH[1]}))
              printf '%s\t%s\n' "$version" "$migration"
            done | sort -n -k1,1 | cut -f2-
          }
          while IFS= read -r f; do
            PGPASSWORD=fqp_test_password psql -X -v ON_ERROR_STOP=1 \
              -h localhost -U fqp -d fqp_test -f "$f"
          done < <(ordered_migrations)
        env:
          PGPASSWORD: fqp_test_password

      - name: Initialize isolated Pi credential database
        run: |
          createdb -h localhost -U fqp fqp_pi_test
          psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_pi_test \
            -f sql/58_llm_provider_connections.sql \
            -f sql/59_llm_agent_bindings.sql \
            -f sql/106_pi_model_credentials.sql
        env:
          PGPASSWORD: fqp_test_password

      - name: Initialize isolated feature contract database
        run: |
          set -euo pipefail
          createdb -h localhost -U fqp fqp_feature_contract_test
          pg_dump --schema-only --no-owner --no-privileges -h localhost -U fqp -d fqp_test \
            | psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_feature_contract_test
          psql -X -v ON_ERROR_STOP=1 -h localhost -U fqp -d fqp_feature_contract_test \
            -c "COMMENT ON DATABASE fqp_feature_contract_test IS 'fqp-p102-isolated-fixtures/v1'"
        env:
          PGPASSWORD: fqp_test_password

      - name: Initialize isolated observation database
        run: bash scripts/ci/init_observation_test_db.sh
        env:
          FQP_ALLOW_ISOLATED_OBSERVATION_SETUP: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: fqp
          PGDATABASE: fqp_test
          PGPASSWORD: fqp_test_password

      - name: Verify prediction inputs without skipped database tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/p105-inputs.xml"
          python -m pytest -q --junitxml="$report" \
            tests/test_storage/test_prediction_input_policy.py \
            tests/test_computation/test_prediction_input_updates_postgres.py \
            tests/test_computation/test_prediction_input_revisions_postgres.py \
            tests/test_computation/test_prediction_input_fence_postgres.py \
            tests/test_computation/test_prediction_input_runtime_postgres.py
          python scripts/ci/verify_prediction_input_results.py "$report"
        env:
          DATABASE_URL: postgresql://invalid:invalid@unavailable.invalid/disabled
          FQP_OBSERVATION_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=fqp_observation_test dbname=fqp_observation_test
          PGPASSWORD: fqp_test_password

      - name: Run tests with coverage
        run: |
          DATABASE_URL=postgresql://fqp:fqp_test_password@localhost:5432/fqp_test \
          pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=50 -m "not slow"
        env:
          DATABASE_URL: postgresql://fqp:fqp_test_password@localhost:5432/fqp_test
          FQP_PI_TEST_DB: postgresql://fqp:fqp_test_password@localhost:5432/fqp_pi_test
          FQP_QUOTA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          FQP_FEATURE_TEST_POSTGRES_DSN: postgresql://fqp:fqp_test_password@localhost:5432/fqp_feature_contract_test
          FQP_OBSERVATION_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=fqp_observation_test dbname=fqp_observation_test
          PGPASSWORD: fqp_test_password
